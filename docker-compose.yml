services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT}:80"
    env_file:
      - backend/compose.env
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"

  db:
    image: postgres:18.6
    restart: no
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGUSER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # postgres 18+ image convention: mount the parent dir, data lands in a versioned subdir
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs:3.99
    command: >
      server -dir=/data
      -master.volumeSizeLimitMB=1024
      -filer -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    restart: no
    ports:
      - "${S3_PORT}:8333"
      - "8889:8888" # filer UI (bucket browser; 8888 taken by selino stack)
    volumes:
      - seaweedfs_data:/data
      - ./backend/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
    driver: local
  seaweedfs_data:
    driver: local
