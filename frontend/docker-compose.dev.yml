services:
  blog-react:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: blog-react-dev
    ports:
      - '3000:80'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
